name: ELHART plugin host checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python skills/elhart-hmi-projects/scripts/test_helpers.py
